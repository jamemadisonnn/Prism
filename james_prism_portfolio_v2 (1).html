<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>James — Selected Work / Optical Portfolio</title><style>
:root{color-scheme:light}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff}body{font-family:Georgia,serif}#stage{display:block;width:100vw;height:100dvh;touch-action:none;cursor:default}#nav{position:fixed;z-index:3;top:22px;left:50%;transform:translateX(-50%);display:flex;gap:3px;font:12px Arial,sans-serif}#nav a{color:#282824;text-decoration:none;background:#ffffffc9;backdrop-filter:blur(12px);border:1px solid #ecece9;border-radius:3px;padding:9px 12px}#nav a:hover{background:#eaeae7}#hint{position:fixed;bottom:15px;right:19px;color:#888;font:11px Arial,sans-serif;pointer-events:none;z-index:2}#error{display:none;position:fixed;inset:0;background:white;color:#222;padding:20vw 10vw;font:16px Arial,sans-serif;z-index:10}@media(max-width:600px){#nav{top:12px}#hint{font-size:10px}}
</style></head><body><canvas id="stage" aria-label="Interactive portfolio with optical prism effect"></canvas><nav id="nav"><a href="#top">James</a><a href="#projects">Projects</a><a href="#about">About</a></nav><div id="hint">Scroll to see the optical dispersion ↓</div><div id="error">Your browser could not start WebGL. Please open this page in an up-to-date Chrome or Safari browser.</div>
<script>
(()=>{'use strict';
const canvas=document.getElementById('stage');const gl=canvas.getContext('webgl',{alpha:false,antialias:false,premultipliedAlpha:false});if(!gl){document.getElementById('error').style.display='block';return}
const vert=`attribute vec2 aPos;varying vec2 vUv;void main(){vUv=aPos*.5+.5;gl_Position=vec4(aPos,0.,1.);}`;
// The optical pass follows the actual reference technique: curved sag, a top and
// bottom 8% band, and 16 wavelength-weighted texture samples. No rainbow overlay.
const frag=`precision highp float;uniform sampler2D tDiffuse;uniform float uBandTop;uniform float uBandBot;uniform float uStrength;uniform float uCurve;uniform float uChromaticAberration;varying vec2 vUv;
float sag(float t){t=clamp(pow(t,uCurve),0.,1.);return 1.-sqrt(max(0.,1.-t*t));}
void main(){vec2 uv=vUv;float dist=0.;
if(uBandTop>0.&&uv.y>1.-uBandTop){float t=(uv.y-(1.-uBandTop))/uBandTop;dist=sag(t)*uBandTop*uStrength;uv.y-=dist;}
else if(uBandBot>0.&&uv.y<uBandBot){float t=(uBandBot-uv.y)/uBandBot;dist=sag(t)*uBandBot*uStrength;uv.y+=dist;}
uv=clamp(uv,vec2(0.),vec2(1.));
if(dist==0.||uChromaticAberration==0.){gl_FragColor=texture2D(tDiffuse,uv);return;}
vec3 finalColor=vec3(0.);vec3 weightSum=vec3(0.);
for(int i=0;i<16;i++){float t=float(i)/15.;vec3 w=vec3(smoothstep(.8,.2,t),smoothstep(0.,.5,t)*smoothstep(1.,.5,t),smoothstep(.2,.8,t));float shift=(t-.5)*uChromaticAberration*dist*30.;vec2 sampleUv=clamp(uv+vec2(0.,shift),vec2(0.),vec2(1.));finalColor+=texture2D(tDiffuse,sampleUv).rgb*w;weightSum+=w;}
finalColor/=max(weightSum,vec3(.0001));gl_FragColor=vec4(finalColor,1.);}`;
function shader(type,source){let s=gl.createShader(type);gl.shaderSource(s,source);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw new Error(gl.getShaderInfoLog(s));return s}
let program;try{program=gl.createProgram();gl.attachShader(program,shader(gl.VERTEX_SHADER,vert));gl.attachShader(program,shader(gl.FRAGMENT_SHADER,frag));gl.linkProgram(program);if(!gl.getProgramParameter(program,gl.LINK_STATUS))throw new Error(gl.getProgramInfoLog(program))}catch(e){console.error(e);document.getElementById('error').style.display='block';return}
gl.useProgram(program);let buffer=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buffer);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);let a=gl.getAttribLocation(program,'aPos');gl.enableVertexAttribArray(a);gl.vertexAttribPointer(a,2,gl.FLOAT,false,0,0);
let uniforms={};for(let k of ['uBandTop','uBandBot','uStrength','uCurve','uChromaticAberration','tDiffuse'])uniforms[k]=gl.getUniformLocation(program,k);
gl.uniform1f(uniforms.uBandTop,.08);gl.uniform1f(uniforms.uBandBot,.08);gl.uniform1f(uniforms.uStrength,1.);gl.uniform1f(uniforms.uCurve,1.);gl.uniform1f(uniforms.uChromaticAberration,.01);gl.uniform1i(uniforms.tDiffuse,0);
let tex=gl.createTexture();gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,tex);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
let off=document.createElement('canvas'),ctx=off.getContext('2d',{alpha:false});let w=0,h=0,dpr=1,scroll=0,target=0,maxScroll=0,blocks={},hit=[];
const serif='Georgia, "Times New Roman", serif',sans='Arial, Helvetica, sans-serif';
function resize(){w=innerWidth;h=innerHeight;dpr=Math.min(devicePixelRatio||1,2);canvas.width=off.width=Math.round(w*dpr);canvas.height=off.height=Math.round(h*dpr);gl.viewport(0,0,canvas.width,canvas.height);ctx.setTransform(dpr,0,0,dpr,0,0);buildLayout();draw();}
function buildLayout(){let mobile=w<640;let frameW=Math.min(1030,w-(mobile?32:90));let frameX=(w-frameW)/2;let contentW=Math.min(520,frameW-(mobile?38:130));let cx=(w-contentW)/2;let top=Math.max(142,Math.min(210,h*.23));let hero=top+190;let projectY=hero+85;let artH=contentW*.67;let gap=mobile?72:105;let projects=[{title:'StockBase',sub:'Inventory intelligence / Systems / 2026',label:'STOCKBASE',kind:0},{title:'StockFlow',sub:'Mobile stock counting / Product design / 2026',label:'STOCKFLOW',kind:1},{title:'Selected experiments',sub:'Creative development / Digital craft',label:'EXPERIMENTS',kind:2}].map((p,i)=>({...p,y:projectY+i*(artH+gap+48)}));let aboutY=projects[2].y+artH+gap+70;let fullH=aboutY+350;maxScroll=Math.max(0,fullH-h+80);target=Math.min(target,maxScroll);blocks={frameW,frameX,contentW,cx,top,hero,projectY,artH,projects,aboutY,fullH,mobile};}
function text(str,x,y,size=14,color='#242421',font=serif,weight='normal',align='left'){ctx.fillStyle=color;ctx.textAlign=align;ctx.textBaseline='alphabetic';ctx.font=`${weight} ${size}px ${font}`;ctx.fillText(str,x,y)}
function line(x1,y1,x2,y2,color='#e8e8e6',width=1){ctx.beginPath();ctx.strokeStyle=color;ctx.lineWidth=width;ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke()}
function art(p,y){let {cx,contentW:ww,artH:hh}=blocks;ctx.save();ctx.beginPath();ctx.rect(cx,y,ww,hh);ctx.clip();let grad=ctx.createLinearGradient(cx,y,cx+ww,y+hh);if(p.kind===0){grad.addColorStop(0,'#d4dcd5');grad.addColorStop(.55,'#7d958b');grad.addColorStop(1,'#233f3b')}else if(p.kind===1){grad.addColorStop(0,'#d8e4ea');grad.addColorStop(.6,'#9ab1c3');grad.addColorStop(1,'#425c73')}else{grad.addColorStop(0,'#e9e6dd');grad.addColorStop(.55,'#b7b3a9');grad.addColorStop(1,'#77776d')}ctx.fillStyle=grad;ctx.fillRect(cx,y,ww,hh);
if(p.kind===0){ctx.save();ctx.translate(cx+ww*.53,y+hh*.53);ctx.rotate(-.13);ctx.fillStyle='#f2f5f0';ctx.shadowColor='#15251e77';ctx.shadowBlur=24;ctx.fillRect(-ww*.35,-hh*.36,ww*.7,hh*.72);ctx.shadowBlur=0;ctx.fillStyle='#263f36';ctx.fillRect(-ww*.32,-hh*.29,ww*.64,31);text('STOCKBASE / 03',-ww*.29,-hh*.29+20,10,'#e4f4e8',sans,'bold');for(let i=0;i<6;i++){ctx.fillStyle=i%2?'#e9eee8':'#d6e1d8';ctx.fillRect(-ww*.29,-hh*.14+i*hh*.07,ww*.57,hh*.049);ctx.fillStyle=i%3===0?'#729d7f':'#b1bdb1';ctx.fillRect(ww*.13,-hh*.14+i*hh*.07,ww*.13,hh*.049)}ctx.restore();}
else if(p.kind===1){ctx.save();ctx.translate(cx+ww*.5,y+hh*.48);ctx.rotate(.12);ctx.shadowColor='#0b2a4777';ctx.shadowBlur=25;ctx.fillStyle='#182c3c';ctx.beginPath();ctx.roundRect(-ww*.2,-hh*.45,ww*.4,hh*.9,25);ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#edf2f4';ctx.beginPath();ctx.roundRect(-ww*.18,-hh*.41,ww*.36,hh*.82,18);ctx.fill();text('StockFlow',-ww*.14,-hh*.28,15,'#263e4a',sans,'bold');for(let i=0;i<5;i++){ctx.fillStyle='#dce4e8';ctx.fillRect(-ww*.14,-hh*.18+i*hh*.12,ww*.28,hh*.085);ctx.fillStyle='#648e99';ctx.fillRect(-ww*.115,-hh*.155+i*hh*.12,ww*.12,hh*.018)}ctx.restore();}
else{ctx.save();ctx.translate(cx+ww*.52,y+hh*.55);for(let i=0;i<8;i++){ctx.rotate(.31);ctx.beginPath();ctx.ellipse(0,-hh*.16,ww*.09,hh*.27,.2,0,Math.PI*2);ctx.fillStyle=['#f0e9df88','#cbc3b7a0','#73786c88'][i%3];ctx.fill()}ctx.restore();}
ctx.restore()}
function draw(){if(!w)return;ctx.setTransform(dpr,0,0,dpr,0,0);ctx.fillStyle='#fff';ctx.fillRect(0,0,w,h);let {frameX,frameW,cx,contentW,top,hero,artH,projects,aboutY,fullH}=blocks;ctx.save();ctx.translate(0,-scroll);line(frameX,40,frameX,fullH+60);line(frameX+frameW,40,frameX+frameW,fullH+60);text('JAMES / 2026',cx,top,13,'#242421',sans,'bold');text('Independent developer',cx+contentW,top,12,'#777',serif,'normal','right');text('I build useful things.',cx,top+76,Math.min(35,contentW*.075),'#242421',serif);text('Thoughtful digital systems, interfaces and',cx,top+112,14,'#5c5c59');text('experiments at the intersection of design and code.',cx,top+133,14,'#5c5c59');line(cx,hero-10,cx+contentW,hero-10,'#e7e7e4');text('SELECTED WORK',cx,hero+16,10,'#92928d',sans,'bold');
for(let i=0;i<projects.length;i++){let p=projects[i],y=p.y;art(p,y);text(`0${i+1} — ${p.title}`,cx,y+artH+28,16,'#252522');text(p.sub,cx,y+artH+50,12,'#83837f')}
line(cx,aboutY-50,cx+contentW,aboutY-50);text('A LITTLE ABOUT ME',cx,aboutY,10,'#999',sans,'bold');text('Making complex work feel simple.',cx,aboutY+50,Math.min(25,contentW*.055),'#252522');text('Currently exploring better tools, better interfaces,',cx,aboutY+90,13,'#666');text('and new ways to make technology more human.',cx,aboutY+110,13,'#666');text('Available for collaborations  ↗',cx,aboutY+180,13,'#262624');text('© 2026 James. Designed and built with care.',cx,aboutY+250,11,'#999');ctx.restore();
// Re-upload the rendered viewport as the scene texture. The shader then
// refracts the *actual pixels* of the scene rather than a fake duplicate.
gl.bindTexture(gl.TEXTURE_2D,tex);gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,true);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,off);gl.drawArrays(gl.TRIANGLE_STRIP,0,4);}
function frame(){let delta=target-scroll;scroll+=delta*.12;if(Math.abs(delta)<.08)scroll=target;draw();requestAnimationFrame(frame)}
canvas.addEventListener('wheel',e=>{e.preventDefault();target=Math.max(0,Math.min(maxScroll,target+e.deltaY))},{passive:false});let sy=0;canvas.addEventListener('touchstart',e=>{sy=e.touches[0].clientY},{passive:true});canvas.addEventListener('touchmove',e=>{e.preventDefault();let ny=e.touches[0].clientY;target=Math.max(0,Math.min(maxScroll,target+sy-ny));sy=ny},{passive:false});
window.addEventListener('keydown',e=>{if(['ArrowDown','PageDown','ArrowUp','PageUp','Home','End',' '].includes(e.key)){e.preventDefault();let v=e.key==='ArrowDown'?85:e.key==='ArrowUp'?-85:e.key==='PageDown'||e.key===' '?h*.8:e.key==='PageUp'?-h*.8:0;target=e.key==='Home'?0:e.key==='End'?maxScroll:Math.max(0,Math.min(maxScroll,target+v))}});
document.querySelectorAll('#nav a').forEach(el=>el.addEventListener('click',e=>{e.preventDefault();let dest=el.getAttribute('href');target=dest==='#top'?0:dest==='#projects'?blocks.projectY-120:blocks.aboutY-150;target=Math.max(0,Math.min(maxScroll,target))}));addEventListener('resize',resize);resize();requestAnimationFrame(frame);
})();
</script></body></html>
